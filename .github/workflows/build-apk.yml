name: Build In-GRID-able Drawings APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir project
          unzip -q In-GRID-able-Drawings-Playtest-0.1.97.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        working-directory: project/In-GRID-able-Drawings-Playtest-0.1.97
        run: gradle test

      - name: Build debug APK
        working-directory: project/In-GRID-able-Drawings-Playtest-0.1.97
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: In-GRID-able-Drawings-Playtest-0.1-debug
          path: project/In-GRID-able-Drawings-Playtest-0.1.97/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
